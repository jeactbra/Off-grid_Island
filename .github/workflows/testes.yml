name: testes

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes automáticos
        run: python -m unittest discover -s testes -t .
      - name: Validação do conteúdo
        run: python ferramentas/validar_conteudo.py --sementes 500
      - name: Manifesto atualizado
        run: |
          python ferramentas/gerar_manifesto.py
          git diff --exit-code python/arquivos.json

  jogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Tipos e build
        run: npm run build
